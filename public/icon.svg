<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- C 形标记主渐变：青蓝 → 靛 → 紫 -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="55%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 深蓝黑底圆角方形 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#000105"/>

  <!-- C 形弧线（右侧开口，圆头端点） -->
  <path d="M 303.4 151.1 A 128 128 0 1 0 303.4 360.9"
    fill="none" stroke="url(#ring)" stroke-width="62"
    stroke-linecap="round"/>

  <!-- 负空间内的 </> 代码符号 -->
  <polyline points="198,230 172,256 198,282"
    fill="none" stroke="#e2e8f0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="262,230 288,256 262,282"
    fill="none" stroke="#e2e8f0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- C 开口处的像素方块 -->
  <rect x="356" y="176" width="46" height="46" rx="8" fill="#22d3ee"/>
  <rect x="406" y="220" width="54" height="54" rx="9" fill="#6366f1"/>
  <rect x="360" y="284" width="40" height="40" rx="7" fill="#8b5cf6"/>
  <rect x="394" y="338" width="48" height="48" rx="8" fill="#7c3aed"/>
</svg>
